name: SDLC-ready issue
description: Create executable work or a coordination-only epic with SDLC-ready child planning.
body:
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: Choose the SDLC issue category that best matches this request.
      options:
        - Feature / Enhancement
        - Bug
        - Epic
        - Spike
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Epics are coordination-only: they cannot be started or own executable specs. Their children use normal dependency rules. The first ready child creates the aggregate plus its own package; terminal child delivery merges the exact head, closes the child, and closes only fully eligible epic ancestors.
  - type: textarea
    id: context
    attributes:
      label: User Story, Bug/Spike Context, or Epic Goal
      description: Provide the user story for a feature, reproduction context for a bug, research context for a spike, or cross-child outcome for a coordination-only epic.
      placeholder: |
        As a ...
        I want ...
        So that ...

        For bugs: describe observed behavior, expected behavior, and reproduction notes.
        For spikes: describe the decision or gap to research.
        For epics: describe the outcome achieved only after all children deliver.
    validations:
      required: true
  - type: textarea
    id: current-state
    attributes:
      label: Current State / Background
      description: Explain what exists today, why the change is needed, and any relevant constraints.
      placeholder: |
        Current state:
        Motivation:
        Relevant constraints:
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria or Epic Outcomes
      description: For executable work, use Given/When/Then criteria. For an epic, list cross-child outcomes only; children will own executable criteria and Gherkin.
      placeholder: |
        AC1: Short name
        Given ...
        When ...
        Then ...

        AC2: Short name
        Given ...
        When ...
        Then ...

        Epic only:
        EO1: Cross-child outcome (no Given/When/Then and no executable ownership)
    validations:
      required: true
  - type: textarea
    id: functional-requirements
    attributes:
      label: Functional Requirements or Epic Child Plan
      description: Capture executable requirements, or for an epic list proposed children and genuine sibling/external prerequisites. Epic membership itself is informational.
      placeholder: |
        | ID | Requirement | Priority | Notes |
        |----|-------------|----------|-------|
        | FR1 | ... | Must | ... |

        Epic only:
        | Child | Depends On | Summary |
        |-------|------------|---------|
        | Child 1 | None | ... |
    validations:
      required: true
  - type: textarea
    id: scope-boundaries
    attributes:
      label: Scope Boundaries
      description: Make the implementation boundary explicit.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Choose the MoSCoW priority for this work.
      options:
        - Must
        - Should
        - Could
        - "Won't"
    validations:
      required: true
  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      description: Add relevant links, constraints, risks, or known gaps.
      placeholder: |
        Links:
        Constraints:
        Known gaps:
    validations:
      required: false
