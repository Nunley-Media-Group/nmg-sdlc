name: nmg-sdlc contract verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nmg-sdlc-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Jest and plugin surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install contract-test deps
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: Run contract tests
        working-directory: scripts
        run: npm test

      - name: Verify OMP plugin surface
        run: node scripts/verify-plugin-surface.mjs --root . --label repository
